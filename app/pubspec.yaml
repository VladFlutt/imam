name: imam
description: "Имам — справочник мусульманина: время намаза, Кибла, Коран, календарь, мечети и халяль."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  adhan_dart: ^2.0.1
  hijri: ^3.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  intl: any
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/ai/blocklist.json
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-VF.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-VF.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
