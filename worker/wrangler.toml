name = "imam-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Бесплатная модель Cloudflare Workers AI — последний резерв, работает без внешних ключей.
[ai]
binding = "AI"

# Необязательно: KV для дневного лимита по IP (создать: npx wrangler kv namespace create RATE)
# [[kv_namespaces]]
# binding = "RATE"
# id = "<id>"

[vars]
GROQ_MODEL = "llama-3.3-70b-versatile"
OPENROUTER_MODEL = "meta-llama/llama-3.3-70b-instruct:free"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
DAILY_LIMIT_PER_IP = "60"
