# Тесты и выкладка сервера ИИ-помощника (worker/) на Cloudflare Workers.
# Выкладка включается, когда в Settings → Secrets and variables → Actions
# добавлены секреты CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID.
# Необязательные секреты: GROQ_API_KEY, OPENROUTER_API_KEY (быстрее и точнее
# встроенной модели Cloudflare) и IMAM_ISSUES_TOKEN (заявки на места → issues).
name: AI worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'app/assets/ai/blocklist.json'
      - '.github/workflows/worker.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'app/assets/ai/blocklist.json'
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test

      - name: Нет ключей Cloudflare — выкладка пропущена
        if: env.CLOUDFLARE_API_TOKEN == '' && github.event_name != 'pull_request'
        run: echo "::notice::Добавьте секреты CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID, чтобы выложить помощника."

      - name: Выкладка на Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request'
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "AI_URL=$url" >> "$GITHUB_ENV"
          echo "::notice::Помощник выложен: $url (укажите его в переменной AI_ENDPOINT)"

      - name: Ключи моделей и заявок
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          IMAM_ISSUES_TOKEN: ${{ secrets.IMAM_ISSUES_TOKEN }}
        run: |
          put() { if [ -n "$2" ]; then printf '%s' "$2" | npx wrangler secret put "$1"; fi; }
          put GROQ_API_KEY "$GROQ_API_KEY"
          put OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
          put GITHUB_TOKEN "$IMAM_ISSUES_TOKEN"

      - name: Проверка помощника после выкладки
        if: env.AI_URL != '' && github.event_name != 'pull_request'
        run: |
          sleep 5
          curl -fsS "$AI_URL/health"
          echo
          curl -sS -X POST "$AI_URL/ask" -H 'content-type: application/json' \
            -d '{"question":"Что говорит Коран о терпении?","lang":"ru","ayat":[{"ref":"2:153","text":"О те, которые уверовали! Обращайтесь за помощью к терпению и намазу. Воистину, Аллах — с терпеливыми."}]}' \
            | tee ask.json
          echo
          grep -q '"status":"ok"' ask.json
          echo "Мечети (Москва):"
          curl -sS -D - -o places.json "$AI_URL/places?s=55.70&w=37.50&n=55.82&e=37.72" | grep -iE '^HTTP|x-source|x-cache' || true
          python3 -c "import json;d=json.load(open('places.json'));print('объектов:',len(d.get('elements',[])), d.get('details',''))"
