name: map probe
on:
  push:
    branches: [check/map-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Alternative sources
        shell: python
        run: |
          import json, time, urllib.request, urllib.parse
          UA = 'imam-app/1.0 (+https://github.com/VladFlutt/imam)'
          def get(url, data=None):
              t = time.time()
              req = urllib.request.Request(url, data=data, headers={'User-Agent': UA, 'Origin': 'https://imam-dusky.vercel.app'})
              try:
                  r = urllib.request.urlopen(req, timeout=40); b = r.read(); c = r.status; h = r.headers
              except urllib.error.HTTPError as e:
                  b = e.read(); c = e.code; h = e.headers
              except Exception as e:
                  print(url[:90], '->', repr(e)); return None
              print(url[:90], '->', c, f'{time.time()-t:.1f}s cors=', h.get('Access-Control-Allow-Origin'))
              try: return json.loads(b)
              except Exception: print(b[:200]); return None
          d = get('https://photon.komoot.io/api/?q=mosque&bbox=37.50,55.70,37.72,55.82&osm_tag=amenity:place_of_worship&limit=50')
          if d: print(' photon', len(d['features']), [f['properties'].get('name') for f in d['features']][:6])
          d = get('https://photon.komoot.io/api/?q=%D0%BC%D0%B5%D1%87%D0%B5%D1%82%D1%8C&bbox=37.50,55.70,37.72,55.82&limit=50')
          if d: print(' photon ru', len(d['features']), [f['properties'].get('name') for f in d['features']][:6])
          d = get('https://nominatim.openstreetmap.org/search?q=mosque&viewbox=37.50,55.82,37.72,55.70&bounded=1&format=jsonv2&limit=50&extratags=1')
          if d is not None: print(' nominatim', len(d), [x.get('name') for x in d][:6])
          Q = '[out:json][timeout:25];nwr["amenity"="place_of_worship"]["religion"="muslim"](55.70,37.50,55.82,37.72);out center tags 100;'
          for ep in ['https://overpass-api.de/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass.private.coffee/api/interpreter']:
              d = get(ep, urllib.parse.urlencode({'data': Q}).encode())
              if d: print(' overpass', len(d.get('elements', [])))
