name: map probe
on:
  push:
    branches: [check/map-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Overpass variants
        shell: python
        run: |
          import json, time, urllib.request, urllib.parse
          Q = '[out:json][timeout:25];(nwr["amenity"="place_of_worship"]["religion"="muslim"](55.70,37.50,55.82,37.72);nwr["diet:halal"~"^(yes|only)$"](55.70,37.50,55.82,37.72););out center tags 300;'
          BUA = 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          def go(url, ua, method='POST', ctype=True, accept=None):
              data = urllib.parse.urlencode({'data': Q}).encode()
              h = {'User-Agent': ua, 'Origin': 'https://imam-dusky.vercel.app', 'Referer': 'https://imam-dusky.vercel.app/'}
              if accept: h['Accept'] = accept
              if method == 'GET':
                  req = urllib.request.Request(url + '?' + data.decode(), headers=h)
              else:
                  if ctype: h['Content-Type'] = 'application/x-www-form-urlencoded; charset=utf-8'
                  req = urllib.request.Request(url, data=data, headers=h, method='POST')
              t = time.time()
              try:
                  r = urllib.request.urlopen(req, timeout=45)
                  body = r.read(); code = r.status; hdr = r.headers
              except urllib.error.HTTPError as e:
                  body = e.read(); code = e.code; hdr = e.headers
              except Exception as e:
                  print(f'{url} [{ua[:20]}] {method} -> {e!r}'); return
              cors = hdr.get('Access-Control-Allow-Origin')
              info = body[:120]
              try:
                  els = json.loads(body)['elements']; info = f'elements={len(els)} {[x.get("tags",{}).get("name") for x in els][:5]}'
              except Exception: pass
              print(f'{url} [{ua[:20]}] {method} -> {code} {time.time()-t:.1f}s cors={cors} {info}')
          for ep in ['https://overpass-api.de/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.osm.jp/api/interpreter','https://overpass.kumi.systems/api/interpreter']:
              go(ep, BUA)
          go('https://overpass-api.de/api/interpreter', 'Dart/3.13 (dart:io)')
          go('https://overpass-api.de/api/interpreter', 'imam-app/1.0 (+https://github.com/VladFlutt/imam)')
          go('https://overpass-api.de/api/interpreter', BUA, 'GET')
          go('https://overpass-api.de/api/interpreter', BUA, accept='*/*')
