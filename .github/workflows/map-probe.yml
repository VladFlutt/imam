name: map probe
on:
  push:
    branches: [check/map-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Overpass variants
        run: |
          Q='[out:json][timeout:25];(nwr["amenity"="place_of_worship"]["religion"="muslim"](55.70,37.50,55.82,37.72);nwr["diet:halal"~"^(yes|only)$"](55.70,37.50,55.82,37.72););out center tags 300;'
          BUA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          try() { echo "== $1 [$2]"; curl -sS -m 45 -D h.txt -o o.json -A "$2" -H 'Origin: https://imam-dusky.vercel.app' -H 'Referer: https://imam-dusky.vercel.app/' $3 "$1" -w 'http %{http_code} t=%{time_total}\n' || true; grep -i 'access-control-allow-origin' h.txt || echo 'no CORS'; python3 -c "import json;d=json.load(open('o.json'));e=d['elements'];print('elements',len(e),[x.get('tags',{}).get('name') for x in e][:5])" 2>/dev/null || head -c 400 o.json; echo; }
          for ep in https://overpass-api.de/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.osm.jp/api/interpreter; do
            try $ep "$BUA" "--data-urlencode data=$Q"
          done
          try https://overpass-api.de/api/interpreter "curl/8" "--data-urlencode data=$Q"
          try https://overpass-api.de/api/interpreter "$BUA" "-G --data-urlencode data=$Q"
          echo "== preflight"; curl -sS -m 20 -X OPTIONS -D - -o /dev/null -A "$BUA" -H 'Origin: https://imam-dusky.vercel.app' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' https://overpass-api.de/api/interpreter | head -20
